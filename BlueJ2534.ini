; BlueJ2534 configuration
; This file must sit in the same directory as BlueJ2534.dll.

[connection]
; Mode: bt  = direct Bluetooth RFCOMM (SPP) connection via Winsock
;       com = use a Bluetooth virtual COM port (pair the OBDX Pro FT first,
;             then check Device Manager / "More Bluetooth options" for
;             the OUTGOING COM port number)
Mode=bt

; Bluetooth MAC of the OBDX Pro FT, e.g. 00:1D:A5:68:98:8B.
; Leave empty to discover by name (takes ~10 s on first open).
BtAddress=

; Device-name substring used for discovery when BtAddress is empty.
; (Also works with generic ELM327 adapters: OBDII, ELM327, Vgate, ...)
BtName=OBDX

; Used when Mode=com
ComPort=COM5
Baud=38400

[options]
; Write a debug log to BlueJ2534.log next to the DLL
Log=1
